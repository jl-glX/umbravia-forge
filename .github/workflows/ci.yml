name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use the pinned npm release
        run: npm install --global npm@11.18.0

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Linux deployment scripts
        run: bash -n deploy/*.sh

      - name: Validate code, builds and dependency security
        run: npm run ci:validate

      - name: Validate the Linux deployment package
        env:
          VITE_TURNSTILE_SITE_KEY: ci-only-public-site-key-not-for-deployment
        run: npm run deploy:package

      - name: Publish the Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: umbravia-forge-windows-web-apps-test
          path: |
            .artifacts/umbravia-forge-windows-web-apps-test.zip
            .artifacts/umbravia-forge-windows-web-apps-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
