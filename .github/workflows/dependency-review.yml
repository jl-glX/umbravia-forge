name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        if: github.event.repository.visibility == 'public'
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always

      - name: Record private repository coverage
        if: github.event.repository.visibility != 'public'
        run: >-
          echo "GitHub Dependency Review requires GitHub Advanced Security for
          this repository visibility. The validate job still runs the pinned
          lockfile checks and npm run audit:ci."
